name: chatbot-maria

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatbot-maria-app
    container_name: chatbot-maria-app
    restart: unless-stopped
    ports:
      - "7860:7860"
    env_file:
      - .env
    volumes:
      # Índice Chroma persistente (lectura/escritura: el entrypoint puede reingestar)
      - ./chroma_db:/app/chroma_db
      # Corpus de producción: el MISMO que usa el .env local
      - ./festival_txts_big:/app/festival_txts_big:ro
    environment:
      PYTHONUNBUFFERED: "1"
      # Toda la configuración no secreta está en constants.py.
      # Fuerza reconstruir Chroma desde el corpus al arrancar (útil tras
      # cambiar el corpus). Se toma de la variable del shell; por defecto 0
      # (usa el índice montado y solo ingesta si no existe). Para forzar:
      #   INGEST_ON_START=1 docker compose up --build
      INGEST_ON_START: ${INGEST_ON_START:-0}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7860/').read()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
